services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: capability_flow
      POSTGRES_USER: capability_flow
      POSTGRES_PASSWORD: capability_flow
    ports:
      - "5433:5432"
    volumes:
      - capability_flow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capability_flow -d capability_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  capability_flow_postgres:

