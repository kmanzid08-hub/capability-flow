name: Verify durable tender analysis recovery
on:
  push:
    branches:
      - fix/resumable-opportunity-analysis-20261119
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ci-mocked-provider-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Compile and lint changed modules
        run: |
          python -m compileall -q app/services/requirement_extraction.py app/services/opportunities.py app/services/ai_jobs.py app/services/ai_provider_health.py
          ruff check app/services/requirement_extraction.py app/services/opportunities.py app/services/ai_jobs.py app/services/ai_provider_health.py tests/unit/test_opportunity_chunk_checkpoint.py tests/unit/test_ai_jobs.py
      - name: Validate provider outages, resumable tender chunks and API flow
        run: |
          python -m pytest -q             tests/unit/test_opportunity_chunk_checkpoint.py             tests/unit/test_opportunity_adaptive_split.py             tests/unit/test_opportunity_chunk_safety.py             tests/unit/test_ai_provider_health.py             tests/unit/test_ai_jobs.py             tests/integration/test_opportunities.py
      - name: Complete backend regression suite
        run: python -m pytest -q
      - name: Set up frontend runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify client opportunity page builds
        working-directory: frontend
        run: |
          npm ci
          npm run build
