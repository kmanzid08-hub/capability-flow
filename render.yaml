services:
  - type: web
    name: capability-flow-api
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: pip install .
    startCommand: python -m alembic upgrade head && python -m app.runtime
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    disk:
      name: capability-flow-documents
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: DOCUMENT_STORAGE_PATH
        value: /var/data/documents
      - key: DOCUMENT_MAX_FILE_SIZE_MB
        value: "250"
      - key: AI_MAX_DOCUMENT_CHARS
        value: "500000"
      - key: AI_PDF_VISION_MAX_PAGES
        value: "100"
      - key: AI_JOB_WORKER_ENABLED
        value: "true"
      - key: AI_JOB_WORKER_EMBEDDED
        value: "false"
      - key: AI_JOB_WORKER_CONCURRENCY
        value: "1"
      - key: AI_JOB_MAX_CONCURRENT_PER_ORGANIZATION
        value: "2"
      - key: AI_JOB_MAX_CONCURRENT_PER_USER
        value: "1"
      - key: AI_JOB_MAX_ACTIVE_PER_ORGANIZATION
        value: "50"
      - key: AI_JOB_MAX_ATTEMPTS
        value: "3"
      - key: AI_JOB_LEASE_SECONDS
        value: "120"
      - key: AI_JOB_HEARTBEAT_SECONDS
        value: "15"
      - key: AI_JOB_POLL_SECONDS
        value: "1"
      - key: AI_JOB_RETRY_BASE_SECONDS
        value: "5"
      - key: AI_JOB_RETRY_MAX_SECONDS
        value: "120"
      - key: OPPORTUNITY_MAX_SOURCE_BYTES
        value: "262144000"
      - key: OPPORTUNITY_MAX_SOURCE_CHARACTERS
        value: "2000000"
      - key: OPPORTUNITY_ANALYSIS_CHUNK_CHARACTERS
        value: "100000"
      - key: OPPORTUNITY_ANALYSIS_CHUNK_OVERLAP
        value: "5000"
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-4-20250514

  - type: web
    name: capability-flow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

